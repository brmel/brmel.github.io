<text x="640" y="378" font-family="&#39;Inter Tight&#39;,system-ui,sans-serif" font-size="13" fill="#8a877f">Print: mark ≥ 8mm. Below min, use the simplified favicon mark.</text>
<text x="640" y="400" font-family="&#39;Inter Tight&#39;,system-ui,sans-serif" font-size="13" fill="#8a877f">Optically center the mark; the ring&#39;s mass sits slightly low — nudge up ~1%.</text>
