<!DOCTYPE html>
<html lang="{{ site.Language }}" dir="{{ .Language.LanguageDirection | default "ltr" }}">
<head>
    {{- partial "head.html" . }}
</head>
<body class="{{ cond (or (ne .Kind "page") (eq .Layout "search")) "list" "" }}" id="top">
    {{- partial "header.html" . -}}
    <main class="main{{ block "main-width" . }}{{ end }}" id="main">
        {{- block "main" . }}{{ end }}
    </main>
    {{ partialCached "footer.html" . .Kind (strings.Contains .Content "<pre") -}}
</body>
</html>
