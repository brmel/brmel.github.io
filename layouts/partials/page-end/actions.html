{{- with site.Params.repo }}
<ul class="content-actions">
  <li>
    <a class="u-eyebrow u-rule-link" href="{{ printf "%s/issues/new?title=%s&body=%s" . (urlquery (printf "%s: " ($.Title | plainify))) (urlquery (printf "Page: %s\n\n" $.Permalink)) }}"
       target="_blank" rel="noopener noreferrer">
      {{ i18n "discuss_page" }} <span aria-hidden="true">↗</span>
    </a>
  </li>
</ul>
{{- end }}
