{{- /* Clickable topics at the foot of an article or project page. */ -}}
{{- $terms := .GetTerms "tags" }}
{{- with $terms }}
<nav class="page-tags" aria-label="{{ i18n "page_tags" }}">
  <span class="u-eyebrow page-tags__label">{{ i18n "page_tags" }}</span>
  <ul class="page-tags__list">
    {{- range . }}
    <li><a class="u-chip" href="{{ .RelPermalink }}" dir="auto">{{ .LinkTitle }}</a></li>
    {{- end }}
  </ul>
</nav>
{{- end }}
