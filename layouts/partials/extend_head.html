{{- /*
  extend_head — per-page asset hook (overrides PaperMod's empty stub).

  Lets any page pull in its own stylesheet(s) and script(s) via front
  matter instead of inlining <style>/<script> blocks, keeping content,
  presentation, and behavior in separate layers:

      customCSS: ["css/machine-vision.css"]
      customJS:  ["js/machine-vision.js"]

  Paths resolve from the assets/ directory. Assets are minified and
  fingerprinted through Hugo Pipes and scoped to just the pages that ask
  for them, so other pages don't download them. Scripts are deferred so
  they run after the document is parsed.

  Also sets the document writing direction from the site's configured
  languageDirection. PaperMod's baseof emits <html dir="auto">, which is
  unreliable for laying out RTL boxes; making it explicit lets CSS logical
  properties (margin-inline-*, text-align: start/end) flip correctly on
  Arabic pages. Runs during head parse, so there is no layout flash.
*/ -}}
{{- if eq site.Language.LanguageDirection "rtl" }}
<script>document.documentElement.setAttribute("dir", "rtl");</script>
{{- end }}
{{- /* Brand fonts, loaded site-wide (Instrument Serif / Inter Tight / JetBrains
       Mono). The tokens that use them ship in css/extended/tokens.css, which is
       already concatenated into PaperMod's stylesheet bundle. */ -}}
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
{{- range .Params.customCSS }}
{{- with resources.Get . }}
{{- $css := . | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
{{- end }}
{{- end }}
{{- range .Params.customJS }}
{{- with resources.Get . }}
{{- $js := . | minify | fingerprint }}
<script defer src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}"></script>
{{- end }}
{{- end }}
