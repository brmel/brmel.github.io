{{- $p := .page -}}
<article class="post-entry"{{ partial "func/lang-attrs.html" $p }}>
  <span class="u-bar" aria-hidden="true"></span>
  {{- partial "article/cover.html" $p }}

  <div class="entry-text">
  <header class="entry-header">
    <span class="u-eyebrow entry-eyebrow">
      {{- partial "post_meta.html" $p -}}
      {{- if .showSection }}
        <b class="u-dot" aria-hidden="true">·</b> {{ (site.GetPage $p.Section).Title }}
      {{- end }}
    </span>
    <h2>{{ $p.Title }}</h2>
  </header>
  {{- with $p.Description }}
  <div class="entry-content"><p dir="auto">{{ . }}</p></div>
  {{- end }}
  {{- partial "lang/en-only.html" $p }}
  </div>
  <a class="entry-link" aria-label="{{ $p.Title | plainify }}" href="{{ $p.Permalink }}"></a>
</article>
