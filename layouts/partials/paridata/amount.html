{{- $v := .value -}}
{{- $p := .profile -}}
{{- $sign := cond (lt $v 0.0) "−" (cond (default false .signed) "+" "") -}}
<span class="paridata-amount{{ with .class }} {{ . }}{{ end }}"
  ><bdi class="paridata-amount__u" dir="ltr">{{ printf "%s%.2fu" $sign (math.Abs $v) }}</bdi
  ><bdi class="paridata-amount__m" dir="ltr">{{ printf "%s%s%.2f" $sign ($p.staking.currencySymbol | default "$") (math.Abs (mul $v $p.staking.currencyPerUnit)) }}</bdi
></span>
