{{- $og := partial "func/og-image.html" . }}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ $og.url }}">
<meta name="twitter:image:alt" content="{{ $og.alt }}">
<meta name="twitter:title" content="{{ .Title | plainify }}">
<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ if .IsPage }}{{ .Summary }}{{ else }}{{ site.Params.description }}{{ end }}{{ end }} ">
{{- with site.Params.social }}
  {{- if reflect.IsMap . }}
    {{- with .twitter }}
      {{- $content := . }}
      {{- if not (strings.HasPrefix . "@") }}{{ $content = printf "@%v" . }}{{ end }}
<meta name="twitter:site" content="{{ $content }}">
    {{- end }}
  {{- end }}
{{- end }}
