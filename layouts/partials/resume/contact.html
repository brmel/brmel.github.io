<ul class="u-eyebrow resume__contact">
  <li><button type="button" class="u-rule-link resume__print" onclick="window.print()">{{ i18n "resume_print" }}</button></li>
  {{- range . }}
  <li><a class="u-rule-link" href="{{ .url }}"{{ if hasPrefix .url "http" }} target="_blank" rel="noopener noreferrer"{{ end }}>
    {{- range where site.Params.socialIcons "url" .url }}{{ partial "brand/social-icon.html" .name }}{{ end }}<span>{{ .label }}</span></a></li>
  {{- end }}
</ul>
