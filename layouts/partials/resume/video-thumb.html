{{- $alt := .alt | default (i18n "career_video") -}}
{{- with resources.Get (printf "images/timeline/%s.jpg" .id) }}
{{- $sm := .Resize "320x webp q80" }}
{{- $lg := .Resize "480x webp q80" }}
<button type="button" class="u-card u-card--interactive video-thumb" data-video="{{ $.id }}" aria-label="{{ i18n "career_play_video" }}: {{ $alt }}">
  <img src="{{ $sm.RelPermalink }}" srcset="{{ $sm.RelPermalink }} 320w, {{ $lg.RelPermalink }} 480w" sizes="(max-width: 768px) 104px, 180px"
       width="{{ $lg.Width }}" height="{{ $lg.Height }}" loading="lazy" decoding="async" alt="">
  <span class="video-thumb__play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg></span>
</button>
{{- end }}
