{{- $title := .Get "title" | default (i18n "map") -}}
{{- with .Get "q" }}
<p>
  <a class="u-link" href="https://www.google.com/maps/search/?{{ (querify "api" "1" "query" .) | safeURL }}"
     target="_blank" rel="noopener noreferrer"><span>{{ $title }} <span aria-hidden="true">↗</span></span></a>
</p>
{{- end }}
