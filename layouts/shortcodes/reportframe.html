{{- $src := .Get "src" -}}
{{- $r := resources.Get $src -}}
{{- with $r -}}

<iframe id="reportFrame" class="report-frame" src="{{ .RelPermalink }}" title="{{ $.Get `title` | default `Report` }}" loading="lazy"></iframe>
<script>
(function () {
  var f = document.getElementById('reportFrame'); if (!f) return;
  function fit() {
    try {
      var d = f.contentWindow.document;
      var h = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight);
      if (h > 200) f.style.height = h + 'px';
    } catch (e) {}
  }
  f.addEventListener('load', function () {
    fit();
    [200, 600, 1500, 3000].forEach(function (t) { setTimeout(fit, t); });   // Plotly/Leaflet lay out late
    try { new ResizeObserver(fit).observe(f.contentWindow.document.body); } catch (e) {}
  });
  window.addEventListener('resize', fit);
})();
</script>
{{- else -}}
{{- warnf "reportframe: resource %q not found in the page bundle" $src -}}
{{- end -}}
