{{- $src := .Get "src" -}}
{{- $r := resources.Get $src -}}
{{- with $r -}}

<iframe id="reportFrame" class="report-frame u-wide" src="{{ .RelPermalink }}" title="{{ $.Get `title` | default (i18n `report`) }}" loading="lazy"></iframe>
<script>
(function () {
  var f = document.getElementById('reportFrame'); if (!f) return;
  var last = 0;
  function fit() {
    try {
      var h = f.contentWindow.document.body.scrollHeight;
      if (h > 200 && Math.abs(h - last) > 2) { last = h; f.style.height = h + 'px'; }
    } catch (e) {}
  }
  f.addEventListener('load', function () {
    var d = f.contentWindow.document;
    d.documentElement.style.overflow = 'hidden';
    var own = d.getElementById('theme-toggle');
    if (own) own.style.display = 'none';
    function theme() { d.documentElement.setAttribute('data-theme', document.body.classList.contains('dark') ? 'dark' : 'light'); }
    theme();
    new MutationObserver(theme).observe(document.body, { attributes: true, attributeFilter: ['class'] });
    fit();
    [200, 600, 1500, 3000].forEach(function (t) { setTimeout(fit, t); });
    try { new ResizeObserver(fit).observe(f.contentWindow.document.body); } catch (e) {}
  });
  window.addEventListener('resize', fit);
})();
</script>
{{- else -}}
{{- errorf "reportframe: %q is not in assets/" $src -}}
{{- end -}}
