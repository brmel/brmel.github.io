<div class="timeline-item">
    <div class="timeline-marker"></div>
    <div class="timeline-content">
        {{- /* dir=auto: year ranges are numeric and get bidi-reordered inside an RTL
       page; auto lets the browser resolve each date by its own first strong
       character instead of inheriting the page direction. */ -}}
        <div class="timeline-date" dir="auto">{{ .Get "date" }}</div>
        <h3 class="timeline-title">{{ .Get "title" | markdownify }}</h3>
        <div class="timeline-body">
            {{ .Inner | markdownify | replaceRE "<img " " <img loading=\"lazy\" " | safeHTML }}
        </div>
    </div>
</div>
