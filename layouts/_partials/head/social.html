{{- $og := partial "func/og-image.html" . }}
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:title" content="{{ partial "func/title.html" . }}">
<meta property="og:description" content="{{ .Description | default site.Params.description | plainify }}">
<meta property="og:locale" content="{{ replace site.Language.Locale "-" "_" }}">
{{- range .Translations }}
<meta property="og:locale:alternate" content="{{ replace .Language.Locale "-" "_" }}">
{{- end }}
{{- if and .IsPage (in site.Params.mainSections .Section) }}
<meta property="og:type" content="article">
<meta property="article:published_time" content="{{ .Date.Format "2006-01-02" }}">
<meta property="article:modified_time" content="{{ .Lastmod.Format "2006-01-02" }}">
{{- else }}
<meta property="og:type" content="website">
{{- end }}
<meta property="og:image" content="{{ $og.url }}">
<meta property="og:image:alt" content="{{ $og.alt }}">
<meta property="og:image:width" content="{{ $og.width }}">
<meta property="og:image:height" content="{{ $og.height }}">
<meta name="twitter:card" content="summary_large_image">
