{{- with .pages }}
<section class="home-cards" aria-labelledby="home-{{ $.id }}">
  <h2 class="u-heading" id="home-{{ $.id }}">{{ $.title }}</h2>
  {{- partial "article/grid.html" (dict "pages" . "showSection" true "level" 3 "sizes" "(max-width: 719px) calc(100vw - 32px), (max-width: 1111px) calc(50vw - 40px), 384px") }}
</section>
{{- end }}
