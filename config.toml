baseURL = "https://ibraverse.ca"
defaultContentLanguage = "en"
title = "Ibraverse"
disableKinds = ["taxonomy", "term"]

[languages.en]
  locale = "en-CA"
  label = "English"
  weight = 1
  [languages.en.params]
    description = "Senior Software Developer at Zebra Technologies: 2D and 3D machine vision algorithms in C++, numerical methods, low-level systems and concurrency."
    name = "Brahim Redouane Mellah"
    tagline = "Senior Software Developer at Zebra Technologies · machine vision and machine learning in C++ · Montréal"
  [languages.en.menu]
    main = [
      { identifier = "resume", name = "Resume", url = "/resume/", weight = 2 },
      { identifier = "projects", name = "Projects", url = "/projects/", weight = 3 },
      { identifier = "tech", name = "Tech", url = "/tech/", weight = 4 },
      { identifier = "adventures", name = "Adventures", url = "/adventures/", weight = 5 },
    ]

[languages.fr]
  locale = "fr-CA"
  label = "Français"
  weight = 2
  [languages.fr.params]
    description = "Développeur logiciel senior chez Zebra Technologies : algorithmes de vision industrielle 2D et 3D en C++, méthodes numériques, systèmes bas niveau et concurrence."
    name = "Brahim Redouane Mellah"
    tagline = "Développeur logiciel senior chez Zebra Technologies · vision industrielle et apprentissage automatique en C++ · Montréal"
  [languages.fr.menu]
    main = [
      { identifier = "resume", name = "CV", url = "/resume/", weight = 2 },
      { identifier = "projects", name = "Projets", url = "/projects/", weight = 3 },
      { identifier = "tech", name = "Tech", url = "/tech/", weight = 4 },
      { identifier = "adventures", name = "Aventures", url = "/adventures/", weight = 5 },
    ]

[languages.ar]
  locale = "ar"
  label = "العربية"
  direction = "rtl"
  weight = 3
  [languages.ar.params]
    description = "مطور برمجيات أول في Zebra Technologies: خوارزميات الرؤية الآلية ثنائية وثلاثية الأبعاد بلغة ‎C++‎، والطرق العددية، والأنظمة منخفضة المستوى، والتزامن."
    name = "إبراهيم رضوان ملاح"
    tagline = "مطور برمجيات أول في Zebra Technologies · الرؤية الآلية وتعلّم الآلة بلغة ‎C++‎ · مونتريال"
  [languages.ar.menu]
    main = [
      { identifier = "resume", name = "السيرة الذاتية", url = "/resume/", weight = 2 },
      { identifier = "projects", name = "المشاريع", url = "/projects/", weight = 3 },
      { identifier = "tech", name = "تقنية", url = "/tech/", weight = 4 },
      { identifier = "adventures", name = "مغامرات", url = "/adventures/", weight = 5 },
    ]

[frontmatter]
  lastmod = ["lastmod", "date", "publishDate"]

[imaging.webp]
  method = 6

[minify]
  disableXML = true
  minifyOutput = true

[params]
  photo = "images/profile.jpg"
  mainSections = ["projects", "tech", "adventures"]
  themeColor = "#ffffff"

[services.googleAnalytics]
  ID = "G-CHFGS2DHF6"

[markup]
  [markup.highlight]
    guessSyntax = true
    noClasses = false

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$', '$$']]
        inline = [['\(', '\)']]

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
[outputFormats.LLMSFULL]
  mediaType = "text/plain"
  baseName = "llms-full"
  isPlainText = true

[outputs]
  home = ["HTML", "RSS", "LLMS", "LLMSFULL"]

[[cascade]]
  [cascade.build]
    publishResources = false

[[cascade]]
  outputs = ["HTML", "markdown"]
  [cascade.target]
    kind = "page"
    path = "{/tech/**,/adventures/**}"

