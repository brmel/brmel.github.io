# Only tags. PaperMod ships a categories taxonomy too, and it was building three
# empty index pages in three languages that no content fed and nothing linked to.
[taxonomies]
  tag = "tags"

[pagination]
  pagerSize = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false

enableEmoji = true

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  title = "Ibraverse"
  # Sections that count as "the work" — drives the home page's latest-posts list
  # (layouts/_default/list.html) and anything else ranging over site content.
  # `projects` is listed ahead of the section existing (#12) so adding it needs
  # no config change.
  mainSections = ["projects", "tech", "adventures", "thoughts"]
  description = "Senior Software Developer at Zebra Technologies specializing in Machine Vision, Image Processing, and Control Systems. 5+ years of industrial experience in C++, AI, and real-time systems."
  keywords = ["machine vision", "image processing", "computer vision", "industrial algorithms", "OpenCV", "C++", "control theory", "robotics", "AI", "Zebra Technologies", "Matrox", "real-time systems", "AGM", "geometric matching"]
  author = "Ibraverse"
  images = ["images/MyPhoto.jpg"]
  # A localised layout, not a Go one. "January 2, 2006" is a fixed English
  # pattern, so /fr/ and /ar/ printed "August 4, 2026" on every card and every
  # article — the one string on those pages that never got translated.
  # ":date_long" resolves per language: 4 août 2026 · ٤ أغسطس ٢٠٢٦.
  # Call it through `time.Format`; `.Format` is Go's and ignores the locale.
  DateFormat = ":date_long"
  # Light is the brand's home theme; dark is a full, contrast-audited
  # palette in tokens.css and is reachable from the toggle in the nav.
  defaultTheme = "light"
  disableThemeToggle = false
  ShowReadingTime = false
  ShowShareButtons = true
  ShowPostNavLinks = false
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  hideAuthor = true
  hideSummary = false
  showtoc = false
  tocopen = false

  # Contribute links (partials/content-actions.html) are derived from these.
  # PaperMod's editPost pointed at a mailto, which asked a stranger to describe
  # a typo in an email with no path to a commit.
  repo = "https://github.com/brmel/brmel.github.io"

  [params.assets]
    # Every file below exists in static/ and is generated from the compass mark
    # (layouts/partials/brand-mark.html) — see scripts/gen-favicons.py.
    favicon = "favicon.ico"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
    safari_pinned_tab = "safari-pinned-tab.svg"
    # Browser chrome colours — brand paper, not PaperMod's default slate #2e2e33.
    theme_color = "#faf9f6"
    msapplication_TileColor = "#faf9f6"

  [params.label]
    text = "Ibraverse"
    icon = "favicon.ico"
    iconHeight = 35

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/brmel"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/brahim-redouane-mellah/"
  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/BrmelB"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:mellah.brahim.redouane@gmail.com"
  [[params.socialIcons]]
    name = "facebook"
    url = "https://www.facebook.com/mellah.brahim.redouane"
  [[params.socialIcons]]
    name = "instagram"
    url = "https://www.instagram.com/mellahredouane/"

  # No [params.analytics.*] verification tags: absent beats fake. Add a block
  # back only when the site is actually registered with that search console,
  # with the real token.

  [params.cover]
    hidden = true
    hiddenInList = false
    hiddenInSingle = true

  # Contribute links (partials/content-actions.html) are derived from these.
  # PaperMod's editPost pointed at a mailto, which asked a stranger to describe
  # a typo in an email with no path to a commit.
  repo = "https://github.com/brmel/brmel.github.io"

  # Comments — giscus, storing every thread as a GitHub Discussion.
  # Renders nothing until `enabled` is true AND every id below is filled, so a
  # half-configured widget can never ship. Only the sections listed here get it.
  [params.comments]
    enabled    = false
    repo       = "brmel/brmel.github.io"
    repoId     = "R_kgDOPJVQtA"
    category   = "Announcements"
    categoryId = "DIC_kwDOPJVQtM4DDjn9"
    sections   = ["projects", "tech", "thoughts", "adventures"]
    themeLight = "light"
    themeDark  = "transparent_dark"
  tag = "tags"