[pagination]
  pagerSize = 10
enableRobotsTXT = true

enableEmoji = true

[minify]
  disableXML = true
  minifyOutput = true

[params]
  title = "Ibraverse"
  mainSections = ["projects", "tech", "adventures", "thoughts"]
  images = ["images/profile.jpg"]
  DateFormat = ":date_long"
  defaultTheme = "light"
  ShowReadingTime = true

  ShowToc = true
  ShowShareButtons = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true

  repo = "https://github.com/brmel/brmel.github.io"

  proseColumnPx = 900

  [params.assets]
    favicon = "favicon.ico"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
    safari_pinned_tab = "safari-pinned-tab.svg"
    theme_color = "#faf9f6"
    msapplication_TileColor = "#faf9f6"

  [params.social]
    twitter = "BrmelB"

  [params.label]
    text = "Ibraverse"

  [[params.socialIcons]]
    name = "github"
    title = "GitHub"
    url = "https://github.com/brmel"
  [[params.socialIcons]]
    name = "linkedin"
    title = "LinkedIn"
    url = "https://www.linkedin.com/in/brahim-redouane-mellah/"
  [[params.socialIcons]]
    name = "x"
    title = "X"
    url = "https://x.com/BrmelB"
  [[params.socialIcons]]
    name = "email"
    title = "Email"
    url = "mailto:mellah.brahim.redouane@gmail.com"
  [[params.socialIcons]]
    name = "facebook"
    title = "Facebook"
    url = "https://www.facebook.com/mellah.brahim.redouane"
  [[params.socialIcons]]
    name = "instagram"
    title = "Instagram"
    url = "https://www.instagram.com/mellahredouane/"

[services.googleAnalytics]
  ID = "G-CHFGS2DHF6"

[markup]
  [markup.highlight]
    guessSyntax = true
    noClasses = false

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
[outputFormats.LLMSFULL]
  mediaType = "text/plain"
  baseName = "llms-full"
  isPlainText = true
[outputFormats.markdown]
  mediaType = "text/markdown"
  baseName = "index"
  isPlainText = true
  rel = "alternate"

[outputs]
  home = ["HTML", "RSS", "JSON", "LLMS", "LLMSFULL"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"
[[cascade]]
  [cascade.build]
    publishResources = false

[[cascade]]
  outputs = ["HTML", "markdown"]
  [cascade._target]
    kind = "page"
    path = "{/tech/**,/thoughts/**,/adventures/**}"

[[cascade]]
  robotsNoIndex = true
  [cascade._target]
    kind = "{term,taxonomy}"

