[minify]
  disableXML = true
  minifyOutput = true

[params]
  mainSections = ["projects", "tech", "adventures"]
  defaultTheme = "light"
  UseHugoToc = true
  repo = "https://github.com/brmel/brmel.github.io"
  socialIcons = [
    { name = "github", title = "GitHub", url = "https://github.com/brmel" },
    { name = "linkedin", title = "LinkedIn", url = "https://www.linkedin.com/in/brahim-redouane-mellah/" },
    { name = "x", title = "X", url = "https://x.com/BrmelB" },
    { name = "email", title = "Email", url = "mailto:mellah.brahim.redouane@gmail.com" },
    { name = "facebook", title = "Facebook", url = "https://www.facebook.com/mellah.brahim.redouane" },
    { name = "instagram", title = "Instagram", url = "https://www.instagram.com/mellahredouane/" },
  ]

  [params.assets]
    theme_color = "#faf9f6"
    msapplication_TileColor = "#faf9f6"

  [params.fuseOpts]
    threshold = 0.2
    minMatchCharLength = 3
    keys = ["title", "summary", "content"]

  [params.social]
    twitter = "BrmelB"

[services.googleAnalytics]
  ID = "G-CHFGS2DHF6"

[markup]
  [markup.highlight]
    guessSyntax = true
    noClasses = false

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
[outputFormats.LLMSFULL]
  mediaType = "text/plain"
  baseName = "llms-full"
  isPlainText = true

[outputs]
  home = ["HTML", "RSS", "JSON", "LLMS", "LLMSFULL"]

[[cascade]]
  [cascade.build]
    publishResources = false

[[cascade]]
  outputs = ["HTML", "markdown"]
  [cascade._target]
    kind = "page"
    path = "{/tech/**,/adventures/**}"

