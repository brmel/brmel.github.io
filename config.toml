[pagination]
  pagerSize = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false

enableEmoji = true

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  title = "Ibraverse"
  mainSections = ["projects", "tech", "adventures", "thoughts"]
  description = "Senior Software Developer at Zebra Technologies working in machine vision, AI and image processing. Industrial C++, algorithms shipped into products that run on factory floors."
  keywords = ["machine vision", "image processing", "computer vision", "industrial algorithms", "OpenCV", "C++", "control theory", "robotics", "AI", "Zebra Technologies", "Matrox", "real-time systems", "AI", "pattern matching", "edge detection", "calibration"]
  author = "Ibraverse"
  images = ["images/MyPhoto.jpg"]
  DateFormat = ":date_long"
  defaultTheme = "light"
  disableThemeToggle = false
  ShowReadingTime = true

  ShowToc = true
  TocOpen = false
  ShowShareButtons = true
  ShowPostNavLinks = false
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  hideAuthor = true
  hideSummary = false
  showtoc = false
  tocopen = false

  repo = "https://github.com/brmel/brmel.github.io"

  proseColumnPx = 900

  [params.assets]
    favicon = "favicon.ico"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
    safari_pinned_tab = "safari-pinned-tab.svg"
    theme_color = "#faf9f6"
    msapplication_TileColor = "#faf9f6"

  [params.label]
    text = "Ibraverse"
    icon = "favicon.ico"
    iconHeight = 35

  [[params.socialIcons]]
    name = "github"
    title = "GitHub"
    url = "https://github.com/brmel"
  [[params.socialIcons]]
    name = "linkedin"
    title = "LinkedIn"
    url = "https://www.linkedin.com/in/brahim-redouane-mellah/"
  [[params.socialIcons]]
    name = "x"
    title = "X"
    url = "https://x.com/BrmelB"
  [[params.socialIcons]]
    name = "email"
    title = "Email"
    url = "mailto:mellah.brahim.redouane@gmail.com"
  [[params.socialIcons]]
    name = "facebook"
    title = "Facebook"
    url = "https://www.facebook.com/mellah.brahim.redouane"
  [[params.socialIcons]]
    name = "instagram"
    title = "Instagram"
    url = "https://www.instagram.com/mellahredouane/"

  [params.cover]
    hidden = true
    hiddenInList = false
    hiddenInSingle = true

  repo = "https://github.com/brmel/brmel.github.io"

  tag = "tags"

[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    lineNumbersInTable = false
    noClasses = false
    style = "github"
    tabWidth = 4

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
[outputFormats.LLMSFULL]
  mediaType = "text/plain"
  baseName = "llms-full"
  isPlainText = true

[outputs]
  home = ["HTML", "RSS", "JSON", "LLMS", "LLMSFULL"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"
[[cascade]]
  [cascade.build]
    publishResources = false

[[cascade]]
  robotsNoIndex = true
  [cascade._target]
    kind = "{term,taxonomy}"

