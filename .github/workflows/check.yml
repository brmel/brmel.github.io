name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.148.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --gc --minify --cleanDestinationDir --baseURL "https://ibraverse.ca/"

      - name: Gates
        run: ./scripts/gates.sh

      - name: Broken internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --offline
            --no-progress
            --include-fragments
            --root-dir "${{ github.workspace }}/public"
            "public/**/*.html"
          fail: true
          output: lychee-internal.md

      - name: External links (advisory)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --exclude-path public
            --scheme https
            "content/**/*.md"
          fail: false
          output: lychee-external.md

      - name: Report
        if: always()
        run: |
          {
            echo "## Link check"
            echo
            echo "### Internal (blocking)"
            cat lychee-internal.md 2>/dev/null || echo "no report"
            echo
            echo "### External (advisory)"
            cat lychee-external.md 2>/dev/null || echo "no report"
          } >> "$GITHUB_STEP_SUMMARY"
