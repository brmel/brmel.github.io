name: Check

# The gate every content change validates against: the site must build, every
# internal link and image must resolve, and no asset may be left orphaned by a
# deletion. Runs on pull requests only — main is covered by the deploy workflow.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Pinned to the version used locally. Bump both together.
      HUGO_VERSION: 0.148.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --gc --minify --cleanDestinationDir --baseURL "https://ibraverse.ca/"

      - name: Orphaned assets
        run: ./scripts/check-orphans.sh

      - name: Social cards
        run: python3 ./scripts/check-og.py

      # Internal links only. External links rot for reasons outside this repo,
      # so they are reported but never fail the job (see the second step).
      - name: Broken internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --include-fragments
            --root-dir "${{ github.workspace }}/public"
            "public/**/*.html"
          fail: true
          output: lychee-internal.md

      - name: External links (advisory)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --exclude-path public
            --scheme https
            "content/**/*.md"
          fail: false
          output: lychee-external.md

      - name: Report
        if: always()
        run: |
          {
            echo "## Link check"
            echo
            echo "### Internal (blocking)"
            cat lychee-internal.md 2>/dev/null || echo "no report"
            echo
            echo "### External (advisory)"
            cat lychee-external.md 2>/dev/null || echo "no report"
          } >> "$GITHUB_STEP_SUMMARY"
