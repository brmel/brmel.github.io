# The hand-maintained half of the continuous-learning block on /projects/.
#
# Keep this to 3–5 items. A "currently learning" list that grows without ever
# shrinking stops being current and starts being a CV. Drop the oldest item when
# you add a new one.
#
# `updated` is rendered on the page on purpose: an undated list of what someone
# is "currently" learning is worse than no list, because it rots silently.
# layouts/partials/projects-learning.html warns in the build log once this is
# more than 6 months old.
updated: 2026-08-09

items:
  - title: "On-device inference for the Farkad pipeline"
    note: >-
      The two passes run server-side today, which means a network round trip
      before you see your own sentence come back. Reading up on what a small
      quantised model can actually resolve on a phone, and where the accuracy
      floor sits.
  - title: "Code signing and desktop distribution"
    note: >-
      TikiPro's installer trips Windows SmartScreen because it is not signed.
      Working out what an EV certificate actually buys, what notarisation costs
      on macOS, and how much of the first-run friction that removes.
  - title: "GTFS-Realtime, not just static GTFS"
    note: >-
      Rekba publishes a static feed. Live vehicle positions are a different
      specification with different failure modes, and the honest version of
      "when is my bus coming" needs it.
  - title: "Writing the failures down while they are fresh"
    note: >-
      Every project page here has a lessons section, and the ones written months
      later are visibly flatter than the ones written the same week. Trying to
      make it a habit rather than an archaeology exercise.
