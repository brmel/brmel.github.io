<?xml version="1.0" encoding="UTF-8"?>
<!--
  Safari pinned-tab mask icon: the Ibraverse compass mark, monochrome.
  Safari discards colour and renders the black shapes as a single-colour mask,
  so everything here is pure black on a transparent ground. Geometry matches
  layouts/partials/brand-mark.html; stroke widths are scaled up slightly
  because the mask is rendered small and thin strokes disappear.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <g fill="none" stroke="#000000" stroke-width="2.5">
    <circle cx="20" cy="20" r="17.5"/>
    <circle cx="20" cy="20" r="10.75"/>
    <line x1="20" y1="1.5" x2="20" y2="8"/>
    <line x1="20" y1="32" x2="20" y2="38.5"/>
    <line x1="1.5" y1="20" x2="8" y2="20"/>
    <line x1="32" y1="20" x2="38.5" y2="20"/>
  </g>
  <circle cx="20" cy="20" r="4" fill="#000000"/>
</svg>
