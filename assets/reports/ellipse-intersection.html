<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intersection of Two Rotated Ellipses</title>
<style>
:root{
  --ink:#181715;--ink-2:#4a4843;--muted:#6e6c65;--border:#d9d6cb;--grid:#e8e5da;
  --bg:#faf9f6;--surface:#f2f0e9;--series-1:#a8431a;--cool:#0a4fd0;color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#ece8dc;--ink-2:#b8b3a2;--muted:#888477;--border:#2c2a23;--grid:#1f1e18;
    --bg:#14130f;--surface:#1c1b16;--series-1:#d97757;--cool:#58a9ff;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;font-size:15px;padding:12px}
header h1{font-size:1.5rem;font-weight:500;margin-block-end:12px}
main{display:grid;gap:12px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
button{
  font:inherit;font-size:.8125rem;color:var(--ink);background:var(--surface);
  border:1px solid var(--border);border-radius:999px;padding:2px 11px;min-height:28px;cursor:pointer
}
.presets button[aria-pressed="true"]{border-color:var(--ink);background:var(--bg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.views{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px 16px;align-items:start}
figure,.side{display:grid;gap:6px}
.side{gap:10px}
.plane{width:100%;aspect-ratio:1;display:block;background:var(--bg);border:1px solid var(--border);border-radius:8px}
.grid line{stroke:var(--grid);stroke-width:1}
.grid .axis{stroke:var(--border)}
.e1{fill:none;stroke:var(--series-1);stroke-width:2}
.e2{fill:none;stroke:var(--cool);stroke-width:2;stroke-dasharray:6 4}
.hit{fill:var(--ink);stroke:var(--bg);stroke-width:2}
.hit.touch{fill:var(--bg);stroke:var(--ink);stroke-width:2.5}
.walker{fill:var(--series-1);stroke:var(--bg);stroke-width:2}
.tag{fill:var(--ink);font-weight:600}
.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:.8125rem;color:var(--ink-2)}
.keys span{display:inline-flex;align-items:center;gap:5px}
.keys svg,legend svg{width:24px;height:12px}
.strip{width:100%;display:block;background:var(--bg);border:1px solid var(--border);border-radius:8px}
.zero{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3}
.curve{fill:none;stroke:var(--series-1);stroke-width:2}
.cursor{stroke:var(--ink);stroke-width:1}
.root{fill:var(--ink);stroke:var(--bg);stroke-width:2}
.root.touch{fill:var(--bg);stroke:var(--ink);stroke-width:2.5}
.ticks{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
figcaption,.note{color:var(--ink-2);font-size:.8125rem}
.walk-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.walk-bar output{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:.8125rem}
.answer{display:grid;gap:4px}
.count strong{font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.875rem;width:100%}
th,td{text-align:end;padding:3px 8px;border-block-end:1px solid var(--border)}
th:first-child,td:first-child,th:last-child,td:last-child{text-align:start}
th{font-weight:500;color:var(--muted);font-size:.75rem}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 16px}
fieldset{border:1px solid var(--border);border-radius:8px;padding:4px 12px 8px;display:grid}
legend{padding-inline:4px;font-weight:600;font-size:.875rem;display:inline-flex;align-items:center;gap:6px}
.row{display:grid;grid-template-columns:6.5em 1fr 3em;align-items:center;gap:8px;font-size:.8125rem}
.row output{text-align:end;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:26px;accent-color:var(--series-1)}
.second input[type=range]{accent-color:var(--cool)}
</style>
</head>
<body>
<header><h1>Intersection of two rotated ellipses</h1></header>
<main>
  <div class="presets" role="group" aria-label="Examples">
    <button type="button" data-preset="four">Four points</button>
    <button type="button" data-preset="three">Three points</button>
    <button type="button" data-preset="two">Two points</button>
    <button type="button" data-preset="touch">Touching</button>
    <button type="button" data-preset="apart">Apart</button>
    <button type="button" data-preset="inside">One inside</button>
    <button type="button" data-preset="same">Same ellipse</button>
  </div>

  <div class="views">
    <figure>
      <svg class="plane" id="plane" viewBox="-6 -6 12 12" role="img" aria-labelledby="plane-title">
        <title id="plane-title">The two ellipses on a grid from −6 to 6, with their intersection points numbered</title>
        <g class="grid" id="grid"></g>
        <g transform="scale(1,-1)">
          <ellipse class="e1" id="e1" vector-effect="non-scaling-stroke"></ellipse>
          <ellipse class="e2" id="e2" vector-effect="non-scaling-stroke"></ellipse>
          <g id="hits"></g>
          <circle class="walker" id="walker" vector-effect="non-scaling-stroke"></circle>
        </g>
        <g id="tags"></g>
      </svg>
      <div class="keys">
        <span><svg viewBox="0 0 24 12" aria-hidden="true"><line x1="0" y1="6" x2="24" y2="6" class="e1"/></svg>Ellipse 1</span>
        <span><svg viewBox="0 0 24 12" aria-hidden="true"><line x1="0" y1="6" x2="24" y2="6" class="e2"/></svg>Ellipse 2</span>
        <span><svg viewBox="0 0 24 12" aria-hidden="true"><circle cx="12" cy="6" r="4.5" class="hit"/></svg>crosses</span>
        <span><svg viewBox="0 0 24 12" aria-hidden="true"><circle cx="12" cy="6" r="4" class="hit touch"/></svg>touches</span>
      </div>
    </figure>

    <div class="side">
      <figure>
        <svg class="strip" id="strip" viewBox="0 0 360 160" preserveAspectRatio="none" role="img" aria-labelledby="strip-title">
          <title id="strip-title">g(t) for t from 0 to 360 degrees: above the dashed line the walker is outside ellipse 2, below it inside</title>
          <line class="zero" x1="0" y1="80" x2="360" y2="80" vector-effect="non-scaling-stroke"/>
          <path class="curve" id="curve" vector-effect="non-scaling-stroke"/>
          <line class="cursor" id="cursor" y1="0" y2="160" vector-effect="non-scaling-stroke"/>
        </svg>
        <div class="ticks" aria-hidden="true"><span>0°</span><span>90°</span><span>180°</span><span>270°</span><span>360°</span></div>
        <figcaption>g(t) while walking around ellipse 1: above the line is outside ellipse 2, below is inside.</figcaption>
        <div class="walk-bar">
          <button type="button" id="play" aria-pressed="true">Pause</button>
          <output id="walk-readout" for="play"></output>
        </div>
      </figure>

      <section class="answer" aria-live="polite">
        <p class="count"><strong id="count">0</strong> <span id="count-label">points</span></p>
        <table id="table">
          <thead><tr><th scope="col">#</th><th scope="col">x</th><th scope="col">y</th><th scope="col">How</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <p class="note" id="note" hidden></p>
      </section>
    </div>
  </div>

  <form class="controls" id="controls">
    <fieldset>
      <legend><svg viewBox="0 0 28 12" aria-hidden="true"><line x1="0" y1="6" x2="28" y2="6" class="e1"/></svg>Ellipse 1</legend>
      <div class="row"><label for="e1-h">centre h</label><input type="range" id="e1-h" min="-4" max="4" step="0.1"><output for="e1-h"></output></div>
      <div class="row"><label for="e1-k">centre k</label><input type="range" id="e1-k" min="-4" max="4" step="0.1"><output for="e1-k"></output></div>
      <div class="row"><label for="e1-a">semi-axis a</label><input type="range" id="e1-a" min="0.2" max="4" step="0.1"><output for="e1-a"></output></div>
      <div class="row"><label for="e1-b">semi-axis b</label><input type="range" id="e1-b" min="0.2" max="4" step="0.1"><output for="e1-b"></output></div>
      <div class="row"><label for="e1-theta">angle θ</label><input type="range" id="e1-theta" min="0" max="180" step="1"><output for="e1-theta"></output></div>
    </fieldset>
    <fieldset class="second">
      <legend><svg viewBox="0 0 28 12" aria-hidden="true"><line x1="0" y1="6" x2="28" y2="6" class="e2"/></svg>Ellipse 2</legend>
      <div class="row"><label for="e2-h">centre h</label><input type="range" id="e2-h" min="-4" max="4" step="0.1"><output for="e2-h"></output></div>
      <div class="row"><label for="e2-k">centre k</label><input type="range" id="e2-k" min="-4" max="4" step="0.1"><output for="e2-k"></output></div>
      <div class="row"><label for="e2-a">semi-axis a</label><input type="range" id="e2-a" min="0.2" max="4" step="0.1"><output for="e2-a"></output></div>
      <div class="row"><label for="e2-b">semi-axis b</label><input type="range" id="e2-b" min="0.2" max="4" step="0.1"><output for="e2-b"></output></div>
      <div class="row"><label for="e2-theta">angle θ</label><input type="range" id="e2-theta" min="0" max="180" step="1"><output for="e2-theta"></output></div>
    </fieldset>
  </form>
</main>

<script>
const TAU = 2 * Math.PI;

function at(e, t) {
  const c = Math.cos(e.theta), s = Math.sin(e.theta), x = e.a * Math.cos(t), y = e.b * Math.sin(t);
  return { x: e.h + c * x - s * y, y: e.k + s * x + c * y };
}

function walk(e1, e2) {
  const c2 = Math.cos(e2.theta), s2 = Math.sin(e2.theta), d = e1.theta - e2.theta;
  const cd = Math.cos(d), sd = Math.sin(d), dx = e1.h - e2.h, dy = e1.k - e2.k;
  return {
    q0: [(c2 * dx + s2 * dy) / e2.a, (-s2 * dx + c2 * dy) / e2.b],
    qc: [e1.a * cd / e2.a, e1.a * sd / e2.b],
    qs: [-e1.b * sd / e2.a, e1.b * cd / e2.b],
  };
}

function g(w, t) {
  const c = Math.cos(t), s = Math.sin(t);
  const x = w.q0[0] + w.qc[0] * c + w.qs[0] * s, y = w.q0[1] + w.qc[1] * c + w.qs[1] * s;
  return x * x + y * y - 1;
}

const dot = (u, v) => u[0] * v[0] + u[1] * v[1];
const wrap = (t) => ((t % TAU) + TAU) % TAU;

function coefficients({ q0, qc, qs }) {
  return [
    dot(q0, q0) + (dot(qc, qc) + dot(qs, qs)) / 2 - 1,
    2 * dot(q0, qc), 2 * dot(q0, qs),
    (dot(qc, qc) - dot(qs, qs)) / 2, dot(qc, qs),
  ];
}

const wave = ([c0, c1, s1, c2, s2], t) =>
  c0 + c1 * Math.cos(t) + s1 * Math.sin(t) + c2 * Math.cos(2 * t) + s2 * Math.sin(2 * t);
const slope = ([, c1, s1, c2, s2], t) =>
  -c1 * Math.sin(t) + s1 * Math.cos(t) - 2 * c2 * Math.sin(2 * t) + 2 * s2 * Math.cos(2 * t);
const bend = ([, c1, s1, c2, s2], t) =>
  -c1 * Math.cos(t) - s1 * Math.sin(t) - 4 * c2 * Math.cos(2 * t) - 4 * s2 * Math.sin(2 * t);
const signOf = (x) => (x < 0 ? -1 : 1);

function cubicRoots(a2, a1, a0) {
  const p = a1 - a2 * a2 / 3, q = 2 * a2 ** 3 / 27 - a2 * a1 / 3 + a0, d = (q / 2) ** 2 + (p / 3) ** 3;
  let xs = [0];
  if (d > 0) {
    const u = Math.cbrt(-q / 2 - signOf(q) * Math.sqrt(d));
    xs = [u ? u - p / (3 * u) : 0];
  } else if (p < 0) {
    const rho = Math.sqrt(-p / 3), angle = Math.acos(Math.max(-1, Math.min(1, -q / (2 * rho ** 3))));
    xs = [0, 1, 2].map((k) => 2 * rho * Math.cos((angle - 2 * Math.PI * k) / 3));
  }
  return xs.map((x) => x - a2 / 3);
}

function quadratic(b, c) {
  const d = b * b - 4 * c;
  if (d < 0) return [[-b / 2, Math.sqrt(-d) / 2], [-b / 2, -Math.sqrt(-d) / 2]];
  const y1 = (-b - signOf(b) * Math.sqrt(d)) / 2;
  return [[y1, 0], [y1 ? c / y1 : 0, 0]];
}

function quartic(A, B, C, D, E) {
  const a = B / A, b = C / A, c = D / A, d = E / A;
  let best = null;
  for (const y of cubicRoots(-b, a * c - 4 * d, 4 * b * d - a * a * d - c * c)) {
    const sa = Math.sqrt(Math.max(a * a / 4 - b + y, 0)), sb = Math.sqrt(Math.max(y * y / 4 - d, 0));
    const options = [[a / 2, a / 2, y / 2, y / 2]];
    if (sa) {
      const a1 = a / 2 + sa, a2 = a / 2 - sa, b1 = (c - a1 * y) / (a2 - a1);
      options.push([a1, a2, b1, y - b1]);
    }
    if (sb) {
      const b1 = y / 2 + sb, b2 = y / 2 - sb, a1 = (c - a * b1) / (b2 - b1);
      options.push([a1, a - a1, b1, b2]);
    }
    for (const [a1, a2, b1, b2] of options) {
      const miss = Math.abs(b1 + b2 + a1 * a2 - b) + Math.abs(a1 * b2 + a2 * b1 - c) + Math.abs(b1 * b2 - d);
      if (!best || miss < best[0]) best = [miss, a1, b1, a2, b2];
    }
  }
  const [, a1, b1, a2, b2] = best;
  return [...quadratic(a1, b1), ...quadratic(a2, b2)];
}

function intersect(e1, e2) {
  if (Math.max(e2.a, e2.b) < Math.max(e1.a, e1.b)) [e1, e2] = [e2, e1];
  const w = walk(e1, e2), f = coefficients(w), [c0, c1, s1, c2, s2] = f;
  const size = (Math.hypot(...w.q0) + Math.hypot(...w.qc) + Math.hypot(...w.qs)) ** 2 + 1;
  const tol = 64 * Number.EPSILON * size;
  if (Math.abs(c1) + Math.abs(s1) + Math.abs(c2) + Math.abs(s2) <= tol) {
    return Math.abs(c0) <= tol ? { kind: 'same' } : { kind: 'points', points: [] };
  }
  let phi = 0;
  for (let k = 1; k < 8; k++) {
    if (Math.abs(wave(f, k * Math.PI / 4 + Math.PI)) > Math.abs(wave(f, phi + Math.PI))) phi = k * Math.PI / 4;
  }
  const cp = Math.cos(phi), sp = Math.sin(phi), c2p = Math.cos(2 * phi), s2p = Math.sin(2 * phi);
  const k1 = c1 * cp + s1 * sp, l1 = -c1 * sp + s1 * cp, k2 = c2 * c2p + s2 * s2p, l2 = -c2 * s2p + s2 * c2p;
  const ts = quartic(c0 - k1 + k2, 2 * l1 - 4 * l2, 2 * c0 - 6 * k2, 2 * l1 + 4 * l2, c0 + k1 + k2)
    .filter(([re, im]) => Math.abs(im) <= 1e-3 * (1 + Math.hypot(re, im)))
    .map(([re]) => re)
    .sort((x, y) => x - y)
    .map((x) => phi + 2 * Math.atan(x))
    .filter((t) => Math.abs(wave(f, t)) <= tol + 1e-7 * Math.abs(slope(f, t)));
  const groups = [];
  for (const t of ts) {
    const last = groups.length ? groups[groups.length - 1] : null;
    const gap = last ? t - last[last.length - 1] : 1, mid = last ? (t + last[last.length - 1]) / 2 : t;
    if (last && gap <= 1e-3 && Math.abs(wave(f, mid)) <= tol + Math.abs(bend(f, mid)) * gap * gap / 32) last.push(t);
    else groups.push([t]);
  }
  return {
    kind: 'points',
    points: groups.map((grp) => ({
      ...at(e1, grp.reduce((sum, t) => sum + t, 0) / grp.length),
      kind: grp.length > 1 ? 'touch' : 'cross',
    })),
  };
}
</script>

<script>
const PRESETS = {
  four: [[0, 0, 3, 1.2, 20], [0.5, 0.3, 2.6, 1, 110]],
  three: [[0, 0, 2, 2, 0], [0, 1, 1.6, 3, 0]],
  two: [[-1.2, -0.4, 2.4, 1.4, 30], [1.8, 0.6, 2, 0.9, 150]],
  touch: [[-1.5, 0, 2, 1, 0], [2.5, 0, 2, 1.5, 0]],
  apart: [[-2.5, -1.8, 1.6, 1, 30], [2.2, 1.8, 2, 1, 140]],
  inside: [[0, 0, 3.6, 2.6, 10], [0.6, 0.3, 1.6, 0.8, 50]],
  same: [[0, 0, 3, 1.5, 30], [0, 0, 1.5, 3, 120]],
};
const FIELDS = ['h', 'k', 'a', 'b', 'theta'];
const SVG = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);
const input = (n, f) => $(`e${n}-${f}`);
const fmt = (v) => (Math.abs(v) < 5e-4 ? 0 : v).toFixed(3).replace('-', '−');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let state, walker = 0, playing = !still, last = 0;

function ellipse(n) {
  const [h, k, a, b, deg] = FIELDS.map((f) => Number(input(n, f).value));
  return { h, k, a, b, theta: deg * Math.PI / 180, deg };
}

function grid() {
  const g = $('grid');
  for (let i = -6; i <= 6; i++) {
    for (const [x1, y1, x2, y2] of [[i, -6, i, 6], [-6, i, 6, i]]) {
      const l = document.createElementNS(SVG, 'line');
      Object.entries({ x1, y1, x2, y2, 'vector-effect': 'non-scaling-stroke' }).forEach(([k, v]) => l.setAttribute(k, v));
      if (i === 0) l.classList.add('axis');
      g.append(l);
    }
  }
}

function place(el, e) {
  el.setAttribute('cx', e.h);
  el.setAttribute('cy', e.k);
  el.setAttribute('rx', e.a);
  el.setAttribute('ry', e.b);
  el.setAttribute('transform', `rotate(${e.deg} ${e.h} ${e.k})`);
}

function paramOn(e, p) {
  const c = Math.cos(e.theta), s = Math.sin(e.theta), dx = p.x - e.h, dy = p.y - e.k;
  return wrap(Math.atan2((-s * dx + c * dy) / e.b, (c * dx + s * dy) / e.a));
}

function squash(v) {
  return 80 - 70 * v / (1 + Math.abs(v));
}

function render() {
  const e1 = ellipse(1), e2 = ellipse(2), unit = 12 / $('plane').clientWidth;
  place($('e1'), e1);
  place($('e2'), e2);
  FIELDS.forEach((f) => [1, 2].forEach((n) => {
    const v = Number(input(n, f).value);
    input(n, f).nextElementSibling.value = f === 'theta' ? `${v}°` : v.toFixed(1);
  }));

  const result = intersect(e1, e2), points = result.kind === 'points' ? result.points : [];
  $('hits').replaceChildren(...points.map((p, i) => {
    const c = document.createElementNS(SVG, 'circle');
    c.setAttribute('class', `hit ${p.kind}`);
    c.setAttribute('cx', p.x);
    c.setAttribute('cy', p.y);
    c.setAttribute('r', 5.5 * unit);
    c.setAttribute('vector-effect', 'non-scaling-stroke');
    return c;
  }));
  $('tags').replaceChildren(...points.map((p, i) => {
    const t = document.createElementNS(SVG, 'text');
    t.setAttribute('class', 'tag');
    t.setAttribute('x', p.x + 9 * unit);
    t.setAttribute('y', -p.y - 9 * unit);
    t.setAttribute('font-size', 14 * unit);
    t.textContent = i + 1;
    return t;
  }));

  $('count').textContent = result.kind === 'same' ? '∞' : points.length;
  $('count-label').textContent = result.kind === 'same' ? 'points, same ellipse'
    : points.length === 1 ? 'point' : 'points';
  $('table').hidden = !points.length;
  $('rows').replaceChildren(...points.map((p, i) => {
    const tr = document.createElement('tr');
    [i + 1, fmt(p.x), fmt(p.y), p.kind === 'touch' ? 'touches' : 'crosses'].forEach((v) => {
      const td = document.createElement('td');
      td.textContent = v;
      tr.append(td);
    });
    return tr;
  }));
  const note = result.kind === 'same'
    ? 'Both sliders describe the same ellipse, so every point is shared.'
    : points.length ? '' : 'No common point.';
  $('note').textContent = note;
  $('note').hidden = !note;

  const w = walk(e1, e2), d = [];
  for (let deg = 0; deg <= 360; deg++) d.push(`${deg ? 'L' : 'M'}${deg} ${squash(g(w, deg * Math.PI / 180)).toFixed(2)}`);
  $('curve').setAttribute('d', d.join(''));
  $('strip').querySelectorAll('.root').forEach((r) => r.remove());
  points.forEach((p) => {
    const r = document.createElementNS(SVG, 'circle');
    r.setAttribute('class', `root ${p.kind}`);
    r.setAttribute('cx', paramOn(e1, p) * 180 / Math.PI);
    r.setAttribute('cy', 80);
    r.setAttribute('r', 5 * 360 / $('strip').clientWidth);
    r.setAttribute('vector-effect', 'non-scaling-stroke');
    $('strip').append(r);
  });
  state = { e1, w, unit };
  moveWalker();
}

function moveWalker() {
  const p = at(state.e1, walker), v = g(state.w, walker), deg = walker * 180 / Math.PI;
  $('walker').setAttribute('cx', p.x);
  $('walker').setAttribute('cy', p.y);
  $('walker').setAttribute('r', 4.5 * state.unit);
  $('cursor').setAttribute('x1', deg);
  $('cursor').setAttribute('x2', deg);
  const where = Math.abs(v) < 1e-3 ? 'on ellipse 2' : v > 0 ? 'outside' : 'inside';
  $('walk-readout').value = `t = ${Math.round(deg)}° · g = ${fmt(v)} · ${where}`;
}

function tick(now) {
  if (playing) {
    walker = wrap(walker + Math.min(now - last, 50) / 1000 * TAU / 10);
    moveWalker();
  }
  last = now;
  requestAnimationFrame(tick);
}

function preset(name) {
  PRESETS[name].forEach((values, i) => FIELDS.forEach((f, j) => { input(i + 1, f).value = values[j]; }));
  document.querySelectorAll('[data-preset]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.preset === name));
  render();
}

function setPlaying(on) {
  playing = on;
  $('play').setAttribute('aria-pressed', on);
  $('play').textContent = on ? 'Pause' : 'Walk';
}

grid();
document.querySelectorAll('[data-preset]').forEach((b) => b.addEventListener('click', () => preset(b.dataset.preset)));
$('controls').addEventListener('input', () => {
  document.querySelectorAll('[data-preset]').forEach((b) => b.setAttribute('aria-pressed', 'false'));
  render();
});
$('play').addEventListener('click', () => setPlaying(!playing));
new ResizeObserver(() => state && render()).observe($('plane'));
setPlaying(playing);
preset('four');
requestAnimationFrame(tick);
</script>
</body>
</html>
